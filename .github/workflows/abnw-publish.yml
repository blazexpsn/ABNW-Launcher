name: ABNW Launcher Release

on:
  push:
    branches:
      - main
    paths:
      - "**/launcher.properties"
      - "**/build.gradle"
      - "**/settings.gradle"
      - "src/**"
      - "launcher/**"
      - "linux/**"
      - "flatpak/**"
      - "cosmetics-api/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and replace assets even if this version already has a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: abnw-launcher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read launcher version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.props.outputs.version }}
      java: ${{ steps.props.outputs.java }}
      tag: ${{ steps.props.outputs.tag }}
      project_dir: ${{ steps.props.outputs.project_dir }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Find launcher Gradle project
        id: props
        shell: bash
        run: |
          set -euo pipefail

          PROPERTIES_FILE="$(
            find . -maxdepth 4 -type f -name launcher.properties \
              -exec sh -c 'test -f "$(dirname "$1")/build.gradle" && printf "%s\n" "$1"' _ {} \; \
              | head -n 1
          )"

          if [ -z "$PROPERTIES_FILE" ]; then
            echo "Could not find launcher.properties beside build.gradle." >&2
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROPERTIES_FILE")"
          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          VERSION="$(
            sed -n 's/^[[:space:]]*launcher_version[[:space:]]*=[[:space:]]*//p' "$PROPERTIES_FILE" |
              tail -n 1 |
              tr -d '\r'
          )"

          JAVA_VERSION="$(
            sed -n 's/^[[:space:]]*java_version[[:space:]]*=[[:space:]]*//p' "$PROPERTIES_FILE" |
              tail -n 1 |
              tr -d '\r'
          )"

          if [ -z "$VERSION" ]; then
            echo "launcher_version is missing from $PROPERTIES_FILE" >&2
            exit 1
          fi

          if [ -z "$JAVA_VERSION" ]; then
            echo "java_version is missing from $PROPERTIES_FILE" >&2
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          echo "Launcher project: $PROJECT_DIR"
          echo "ABNW Launcher version: $VERSION"
          echo "Java version: $JAVA_VERSION"

      - name: Check whether this version already exists
        id: check
        shell: bash
        env:
          TAG: ${{ steps.props.outputs.tag }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail

          if [ "$FORCE" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows installer
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java }}

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install WiX Toolset
        shell: powershell
        run: |
          choco install wixtoolset --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        env:
          PROJECT_DIR: ${{ needs.prepare.outputs.project_dir }}
        run: |
          Set-Location $env:PROJECT_DIR
          gradle --no-daemon clean jpackage --stacktrace

      - name: Verify Windows output
        shell: powershell
        env:
          PROJECT_DIR: ${{ needs.prepare.outputs.project_dir }}
        run: |
          $files = Get-ChildItem -Path "$env:PROJECT_DIR/build/distributions" -Filter *.exe -File
          if ($files.Count -eq 0) {
            throw "No Windows .exe was produced."
          }
          $files | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: abnw-windows-${{ needs.prepare.outputs.version }}
          if-no-files-found: error
          path: |
            ${{ needs.prepare.outputs.project_dir }}/build/distributions/*.exe

  linux:
    name: Linux ZIP, Flatpak and standalone JAR
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java }}

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Install Flatpak tooling
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

          flatpak remote-add \
            --user \
            --if-not-exists \
            flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          flatpak install \
            --user \
            --noninteractive \
            --assumeyes \
            flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.openjdk21//24.08

      - name: Build standalone JAR, Linux ZIP and Flatpak
        shell: bash
        env:
          PROJECT_DIR: ${{ needs.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            clean \
            shadowJar \
            linuxZip \
            flatpakLinux \
            --stacktrace

      - name: Verify Linux outputs
        shell: bash
        env:
          PROJECT_DIR: ${{ needs.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "build/libs:"
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -print || true

          echo "build/distributions:"
          find "$PROJECT_DIR/build/distributions" -maxdepth 1 -type f -print || true

          JAR_COUNT="$(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' | wc -l)"
          ZIP_COUNT="$(find "$PROJECT_DIR/build/distributions" -maxdepth 1 -type f -name '*.zip' | wc -l)"
          FLATPAK_COUNT="$(find "$PROJECT_DIR/build/distributions" -maxdepth 1 -type f -name '*.flatpak' | wc -l)"

          if [ "$JAR_COUNT" -lt 1 ]; then
            echo "Standalone JAR is missing." >&2
            exit 1
          fi

          if [ "$ZIP_COUNT" -lt 1 ]; then
            echo "Linux ZIP is missing." >&2
            exit 1
          fi

          if [ "$FLATPAK_COUNT" -lt 1 ]; then
            echo "Flatpak is missing." >&2
            exit 1
          fi

      - name: Stage Linux release files
        shell: bash
        env:
          PROJECT_DIR: ${{ needs.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p release-linux

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            -exec cp -v {} release-linux/ \;

          find "$PROJECT_DIR/build/distributions" \
            -maxdepth 1 \
            -type f \
            \( -name '*.zip' -o -name '*.flatpak' \) \
            -exec cp -v {} release-linux/ \;

          echo "Linux files staged for GitHub:"
          find release-linux -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abnw-linux-${{ needs.prepare.outputs.version }}
          if-no-files-found: error
          path: release-linux/*

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - windows
      - linux

    if: |
      always() &&
      needs.prepare.outputs.should_release == 'true' &&
      needs.windows.result == 'success' &&
      needs.linux.result == 'success'

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: abnw-windows-${{ needs.prepare.outputs.version }}
          path: downloaded/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: abnw-linux-${{ needs.prepare.outputs.version }}
          path: downloaded/linux

      - name: Stage every release asset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-files

          while IFS= read -r -d '' file; do
            cp -v "$file" release-files/
          done < <(
            find downloaded \
              -type f \
              \( \
                -name '*.exe' \
                -o -name '*.jar' \
                -o -name '*.zip' \
                -o -name '*.flatpak' \
              \) \
              -print0
          )

          echo "Assets that WILL be attached to the GitHub release:"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

          EXE_COUNT="$(find release-files -maxdepth 1 -type f -name '*.exe' | wc -l)"
          JAR_COUNT="$(find release-files -maxdepth 1 -type f -name '*.jar' | wc -l)"
          ZIP_COUNT="$(find release-files -maxdepth 1 -type f -name '*.zip' | wc -l)"
          FLATPAK_COUNT="$(find release-files -maxdepth 1 -type f -name '*.flatpak' | wc -l)"

          if [ "$EXE_COUNT" -lt 1 ] || \
             [ "$JAR_COUNT" -lt 1 ] || \
             [ "$ZIP_COUNT" -lt 1 ] || \
             [ "$FLATPAK_COUNT" -lt 1 ]; then
            echo "Release staging is incomplete." >&2
            echo "exe=$EXE_COUNT jar=$JAR_COUNT zip=$ZIP_COUNT flatpak=$FLATPAK_COUNT" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FILES < <(
            find release-files \
              -maxdepth 1 \
              -type f \
              -print |
            sort
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "${GITHUB_SHA}" \
              --title "ABNW Launcher $VERSION" \
              --generate-notes
          fi
