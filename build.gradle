import java.nio.ByteBuffer
import java.nio.ByteOrder

plugins {
	id "application"
	id "com.gradleup.shadow"
}

def launcher = new Properties()

file("launcher.properties").withInputStream {
	launcher.load(it)
}

def prop = { String key ->
	def value = launcher.getProperty(key)

	if (value == null) {
		throw new GradleException(
				"launcher.properties is missing ${key}"
		)
	}

	value.trim()
}

