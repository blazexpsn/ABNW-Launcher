 * NATIVE LINUX FLATPAK BUILD
 * ============================================================
 */

tasks.register(
		"flatpakBuild",
		Exec
) {

	group = "distribution"

	description =
			"Builds the ABNW Launcher Flatpak repository. " +
					"Requires Linux flatpak-builder."

	dependsOn(
			flatpakContextTask
	)

	inputs.file(
			flatpakManifest
	)

	inputs.dir(
			flatpakContext
	)

	outputs.dir(
			flatpakRepository
	)

	outputs.upToDateWhen {
		!(
				project.findProperty(
						"flatpakFullClean"
				)
						?.toString()
						?.toBoolean()
						?:
						false
		)
	}

	doFirst {
		if (!isLinuxHost()) {
			throw new GradleException(
					"The Flatpak task must run on Linux " +
							"with flatpak-builder installed."
			)
		}

		def builder =
				requireFlatpakCommand(
						"flatpak-builder"
				)

		def fullClean =
				project.findProperty(
						"flatpakFullClean"
				)
						?.toString()
						?.toBoolean()
						?:
						false

		if (fullClean) {
			project.delete(
					flatpakBuildDirectory
							.get()
							.asFile,

					flatpakRepository
							.get()
							.asFile
			)
		}

		flatpakBuildDirectory
				.get()
				.asFile
				.mkdirs()

		flatpakRepository
				.get()
				.asFile
				.mkdirs()

		def arguments = [
				builder.absolutePath,
				"--verbose",
				"--default-branch=${version}"
		]

		if (fullClean) {
			arguments <<
					"--force-clean"
		}

		arguments += [
				"--repo=" +
						flatpakRepository
								.get()
								.asFile
								.absolutePath,

				flatpakBuildDirectory
						.get()
						.asFile
						.absolutePath,

				flatpakManifest
						.absolutePath
		]

		commandLine(
				arguments
		)
	}
}

/*
 * ============================================================
 * WSL HELPERS
 * ============================================================
 */

def findWsl = {
	def systemRoot =
			System.getenv(
					"SystemRoot"
			)
					?:
					"C:\\Windows"

	def candidates = [
			new File(
					systemRoot,
					"System32/wsl.exe"
			),

			new File(
					systemRoot,
					"Sysnative/wsl.exe"
			)
	]

	def executable =
			candidates.find {
				it.isFile()
			}

	if (executable == null) {
		throw new GradleException(
				"Could not find wsl.exe. " +
						"Install and initialize an Ubuntu WSL distribution " +
						"before building the Flatpak."
		)
	}

	executable
}

def windowsPathToWsl = {
	File directory ->

		def absolute =
				directory
						.absoluteFile
						.absolutePath

		if (
				!(absolute ==~ /[A-Za-z]:[\\\\].*/)
		) {
			throw new GradleException(
					"The WSL Flatpak build needs a drive-letter " +
							"workspace path, got ${absolute}."
			)
		}

		def drive =
				absolute
						.substring(0, 1)
						.toLowerCase(Locale.ROOT)

		def rest =
				absolute
						.substring(2)
						.replace(
								'\\' as char,
								'/' as char
						)

		"/mnt/${drive}" +
				(
						rest.startsWith("/")
								? rest
								: "/" + rest
				)
}

/*
 * ============================================================
 * WSL COMMAND INVOCATION
 * ============================================================
 */

def invokeWsl = {
	List<?> toolArguments,
	String toolName,
	String workingDirectory = null ->

		if (!isWindowsHost()) {
			throw new GradleException(
					"WSL Flatpak commands can only be invoked from Windows."
			)
		}

		def wsl =
				findWsl()

		def wslDistribution =
				(
						System.getenv(
								"ABNW_WSL_DISTRIBUTION"
						)
								?:
								""
				)
						.trim()

		List<String> wslCommand =
				new ArrayList<>()

		wslCommand.add(
				String.valueOf(
						wsl.absolutePath
				)
		)

		if (
				!wslDistribution.isEmpty()
		) {
			wslCommand.add(
					"--distribution"
			)

			wslCommand.add(
					wslDistribution
			)
		}

		wslCommand.add(
				"--cd"
		)

		wslCommand.add(
				workingDirectory
						?:
						windowsPathToWsl(
								project.projectDir
						).toString()
		)

		wslCommand.add(
				"--"
		)

		toolArguments.each {
			argument ->

				wslCommand.add(
						String.valueOf(
								argument
						)
				)
		}

		String[] wslCommandArray =
				new String[
						wslCommand.size()
						]

		wslCommand.toArray(
				wslCommandArray
		)

		println(
				"[ABNW Flatpak] Running WSL ${toolName}..."
		)

		def startedAt =
				System.nanoTime()

		def wslProcess =
				new ProcessBuilder(
						wslCommandArray
				)
						.directory(
								project.projectDir
						)
						.redirectErrorStream(
								true
						)
						.start()

		def output =
				new StringBuilder()

		wslProcess
				.inputStream
				.withReader(
						"UTF-8"
				) { reader ->

					String line

					while (
							(
									line =
											reader.readLine()
							) != null
					) {
						output
								.append(line)
								.append(
										System.lineSeparator()
								)

						println(
								"[ABNW Flatpak][${toolName}] ${line}"
						)
					}
				}

		def wslExitCode =
				wslProcess.waitFor()

		def wslLogName =
				toolName.replaceAll(
						"[^A-Za-z0-9_.-]",
						"_"
				)

		def wslLog =
				new File(
						flatpakRoot
								.get()
								.asFile,

						"wsl-${wslLogName}.log"
				)

		wslLog
				.parentFile
				.mkdirs()

		wslLog.setText(
				output.toString(),
				"UTF-8"
		)

		def elapsedNanos =
				System.nanoTime() -
						startedAt

		if (
				wslExitCode != 0
		) {
			if (
					wslExitCode == 127
			) {
				throw new GradleException(
						"WSL could not find ${toolName}. " +
								"Install Flatpak and flatpak-builder " +
								"in the selected WSL distribution."
				)
			}

			def outputLines =
					output
							.toString()
							.readLines()

			def tail =
					outputLines
							.takeRight(80)
							.join(
									System.lineSeparator()
							)

			throw new GradleException(
					"The WSL ${toolName} command failed " +
							"with exit code ${wslExitCode}. " +
							"Full output: ${wslLog}\n" +
							"Last output:\n${tail}"
			)
		}

		[
				output:
						output.toString(),

				elapsedNanos:
						elapsedNanos
		]
}

/*
 * ============================================================
 * CREATE TEMPORARY WSL SCRIPTS
 *
 * Important:
 * Bash is stored in generated .sh files instead of
 * embedded Groovy ''' strings.
 * ============================================================
 */

def createWslScript = {
	String name,
	List<String> lines ->

		def scriptDirectory =
				new File(
						flatpakRoot
								.get()
								.asFile,

						"wsl-scripts"
				)

		scriptDirectory.mkdirs()

		def script =
				new File(
						scriptDirectory,
						"${name}.sh"
				)

		script.setText(
				lines.join("\n") + "\n",
				"UTF-8"
		)

		windowsPathToWsl(
				script
		).toString()
}

/*
 * ============================================================
 * NATIVE LINUX FLATPAK BUNDLE
 * ============================================================
 */

def flatpakBundleTask =
		tasks.register(
				"flatpakBundle",
				Exec
		) {

			group = "distribution"

			description =
					"Builds the ABNW Launcher Flatpak bundle. " +
							"Requires Linux flatpak-builder and Flatpak."

			dependsOn(
					"flatpakBuild"
			)

			inputs.dir(
					flatpakRepository
			)

			outputs.file(
					flatpakBundle
			)

			doFirst {
				if (!isLinuxHost()) {
					throw new GradleException(
							"The Flatpak task must run on Linux " +
									"with flatpak-builder installed."
					)
				}

				def flatpak =
						requireFlatpakCommand(
								"flatpak"
						)

				flatpakBundle
						.get()
						.asFile
						.parentFile
						.mkdirs()

				project.delete(
						flatpakBundle
								.get()
								.asFile
				)

				commandLine(
						flatpak.absolutePath,

						"build-bundle",

						"--runtime-repo=" +
								"https://flathub.org/repo/flathub.flatpakrepo",

						flatpakRepository
								.get()
								.asFile
								.absolutePath,

						flatpakBundle
								.get()
								.asFile
								.absolutePath,

						flatpakAppId,

						version.toString()
				)
			}
		}

/*
 * ============================================================
 * NATIVE LINUX ENTRY TASK
 * ============================================================
 */

def flatpakLinuxTask =
		tasks.register(
				"flatpakLinux"
		) {

			group = "distribution"

			description =
					"Builds the ABNW Launcher Flatpak inside a Linux environment."

			dependsOn(
					flatpakBundleTask
			)
		}

/*
 * ============================================================
 * CROSS-PLATFORM FLATPAK ENTRY TASK
 * ============================================================
 */

tasks.register(
		"flatpak"
) {

	group = "distribution"

	description =
			"Builds the ABNW Launcher Flatpak, " +
					"using WSL automatically on Windows."

	if (isLinuxHost()) {
		dependsOn(
				flatpakLinuxTask
		)

	} else if (
			isWindowsHost()
	) {
		dependsOn(
				flatpakContextTask
		)

	} else {
		doLast {
			throw new GradleException(
					"The Flatpak task requires Linux " +
							"or Windows with an initialized WSL distribution."
			)
		}
	}

	inputs.file(
			flatpakManifest
	)

	inputs.file(
			tasks
					.shadowJar
					.archiveFile
	)

	inputs.files(
			"flatpak/launch-abnw-launcher.sh",
			"flatpak/${flatpakAppId}.desktop",
			"src/main/resources/assets/icon_16.png",
			"src/main/resources/assets/icon_32.png",
			"src/main/resources/assets/icon_48.png",
			"src/main/resources/assets/icon_256.png"
	)

	outputs.file(
			flatpakBundle
	)

	outputs.upToDateWhen {
		!(
				project.findProperty(
						"flatpakFullClean"
				)
						?.toString()
						?.toBoolean()
						?:
						false
		)
	}

	doLast {
		if (!isWindowsHost()) {
			return
		}

		def wslContext =
				windowsPathToWsl(
						flatpakContext
								.get()
								.asFile
				)
						.toString()

		def wslManifest =
				windowsPathToWsl(
						flatpakManifest
				)
						.toString()

		def wslBundle =
				windowsPathToWsl(
						flatpakBundle
								.get()
								.asFile
				)
						.toString()

		def fullClean =
				project.findProperty(
						"flatpakFullClean"
				)
						?.toString()
						?.toBoolean()
						?:
						false

		def timings =
				new LinkedHashMap<
						String,
						Long
						>()

		def formatDuration = {
			long nanos ->

				def millis =
						Math.round(
								nanos /
										1_000_000d
						)

				millis < 1000
						?
						"${millis}ms"
						:
						String.format(
								Locale.ROOT,
								"%.2fs",
								nanos /
										1_000_000_000d
						)
		}

		def runStage = {
			String label,
			Closure action ->

				println(
						"[ABNW Flatpak] ${label}..."
				)

				def startedAt =
						System.nanoTime()

				def result =
						action.call()

				def elapsedNanos =
						System.nanoTime() -
								startedAt

				timings[label] =
						elapsedNanos

				println(
						"[ABNW Flatpak] ${label} complete " +
								"(${formatDuration(elapsedNanos)})"
				)

				result
		}

		def totalStartedAt =
				System.nanoTime()

		/*
         * --------------------------------------------------------
         * SYNC SOURCES INTO WSL NATIVE FILESYSTEM
         * --------------------------------------------------------
         */

		runStage(
				"Syncing sources"
		) {

			def script =
					createWslScript(
							"source-sync",
							[
									"#!/usr/bin/env bash",
									"set -eu",
									"",
									'requested_root="$1"',
									'app_id="$2"',
									'source_context="$3"',
									'source_manifest="$4"',
									"",
									'if [ -z "$requested_root" ]; then',
									'  requested_root="$HOME/abnw-flatpak-build"',
									"fi",
									"",
									'case "$requested_root" in',
									'  "~") requested_root="$HOME" ;;',
									'  "~/"*) requested_root="$HOME/${requested_root#~/}" ;;',
									'  /*) ;;',
									'  *) requested_root="$HOME/$requested_root" ;;',
									"esac",
									"",
									'case "$requested_root" in',
									'  /mnt/*)',
									'    echo "ERROR: Flatpak workspace is on a Windows-mounted filesystem: $requested_root"',
									'    echo "Use a WSL-native path such as ~/abnw-flatpak-build"',
									"    exit 2",
									"    ;;",
									"esac",
									"",
									'mkdir -p "$requested_root"',
									"",
									'resolved_root="$(readlink -f "$requested_root")"',
									"",
									'case "$resolved_root" in',
									'  /mnt/*)',
									'    echo "ERROR: Flatpak workspace resolves to a Windows-mounted filesystem: $resolved_root"',
									"    exit 2",
									"    ;;",
									"esac",
									"",
									'workspace="$resolved_root/$app_id"',
									"",
									'echo "Using WSL-native workspace: $workspace"',
									"",
									'mkdir -p "$workspace/flatpak"',
									'mkdir -p "$workspace/build/flatpak"',
									"",
									'rm -rf "$workspace/build/flatpak/context.next"',
									'mkdir -p "$workspace/build/flatpak/context.next"',
									"",
									'cp -a "$source_context/." "$workspace/build/flatpak/context.next/"',
									"",
									'rm -rf "$workspace/build/flatpak/context"',
									'mv "$workspace/build/flatpak/context.next" "$workspace/build/flatpak/context"',
									"",
									'cp "$source_manifest" "$workspace/flatpak/$app_id.yml"'
							]
					)

			invokeWsl(
					[
							"bash",
							script,
							flatpakWslRoot,
							flatpakAppId,
							wslContext,
							wslManifest
					],
					"source-sync"
			)
		}

		/*
         * --------------------------------------------------------
         * DEPENDENCIES
         * --------------------------------------------------------
         */

		runStage(
				"Installing or validating dependencies"
		) {

			def script =
					createWslScript(
							"dependency-setup",
							[
									"#!/usr/bin/env bash",
									"set -eu",
									"",
									'requested_root="$1"',
									'app_id="$2"',
									"",
									'if [ -z "$requested_root" ]; then',
									'  requested_root="$HOME/abnw-flatpak-build"',
									"fi",
									"",
									'case "$requested_root" in',
									'  "~") requested_root="$HOME" ;;',
									'  "~/"*) requested_root="$HOME/${requested_root#~/}" ;;',
									'  /*) ;;',
									'  *) requested_root="$HOME/$requested_root" ;;',
									"esac",
									"",
									'case "$requested_root" in',
									'  /mnt/*)',
									'    echo "ERROR: Flatpak workspace cannot be under /mnt/"',
									"    exit 2",
									"    ;;",
									"esac",
									"",
									"flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo",
									"",
									"missing=()",
									"",
									"for ref in \\",
									"  org.freedesktop.Platform//24.08 \\",
									"  org.freedesktop.Sdk//24.08 \\",
									"  org.freedesktop.Sdk.Extension.openjdk21//24.08",
									"do",
									'  if ! flatpak info --user "$ref" >/dev/null 2>&1 && ! flatpak info --system "$ref" >/dev/null 2>&1; then',
									'    missing+=("$ref")',
									"  fi",
									"done",
									"",
									'if [ "${#missing[@]}" -gt 0 ]; then',
									'  echo "Installing missing Flatpak refs: ${missing[*]}"',
									'  flatpak install --user --assumeyes flathub "${missing[@]}"',
									"else",
									'  echo "All required Flatpak refs are already installed."',
									'  echo "Flatpak caches will be preserved."',
									"fi"
							]
					)

			invokeWsl(
					[
							"bash",
							script,
							flatpakWslRoot,
							flatpakAppId
					],
					"dependency-setup"
			)
		}

		/*
         * --------------------------------------------------------
         * BUILD
         * --------------------------------------------------------
         */

		runStage(
				"Building launcher"
		) {

			def script =
					createWslScript(
							"flatpak-builder",
							[
									"#!/usr/bin/env bash",
									"set -eu",
									"",
									'requested_root="$1"',
									'app_id="$2"',
									'full_clean="$3"',
									"",
									'if [ -z "$requested_root" ]; then',
									'  requested_root="$HOME/abnw-flatpak-build"',
									"fi",
									"",
									'case "$requested_root" in',
									'  "~") requested_root="$HOME" ;;',
									'  "~/"*) requested_root="$HOME/${requested_root#~/}" ;;',
									'  /*) ;;',
									'  *) requested_root="$HOME/$requested_root" ;;',
									"esac",
									"",
									'case "$requested_root" in',
									'  /mnt/*)',
									'    echo "ERROR: Flatpak workspace cannot be under /mnt/"',
									"    exit 2",
									"    ;;",
									"esac",
									"",
									'workspace="$requested_root/$app_id"',
									'build_dir="$workspace/flatpak-build"',
									'manifest="$workspace/flatpak/$app_id.yml"',
									"",
									'cd "$workspace"',
									"",
									'if [ "$full_clean" = "1" ]; then',
									'  echo "Full Flatpak clean requested."',
									'  rm -rf "$build_dir"',
									'  rm -rf "$workspace/flatpak-repo"',
									"fi",
									"",
									"builder_args=(--verbose)",
									"",
									'if [ "$full_clean" = "1" ]; then',
									"  builder_args+=(--force-clean)",
									"fi",
									"",
									'flatpak-builder "${builder_args[@]}" "$build_dir" "$manifest"'
							]
					)

			invokeWsl(
					[
							"bash",
							script,
							flatpakWslRoot,
							flatpakAppId,
							fullClean
									? "1"
									: "0"
					],
					"flatpak-builder"
			)
		}

		/*
         * --------------------------------------------------------
         * EXPORT REPOSITORY
         * --------------------------------------------------------
         */

		runStage(
				"Exporting repository"
		) {

			def script =
					createWslScript(
							"repository-export",
							[
									"#!/usr/bin/env bash",
									"set -eu",
									"",
									'requested_root="$1"',
									'app_id="$2"',
									'app_version="$3"',
									"",
									'if [ -z "$requested_root" ]; then',
									'  requested_root="$HOME/abnw-flatpak-build"',
									"fi",
									"",
									'case "$requested_root" in',
									'  "~") requested_root="$HOME" ;;',
									'  "~/"*) requested_root="$HOME/${requested_root#~/}" ;;',
									'  /*) ;;',
									'  *) requested_root="$HOME/$requested_root" ;;',
									"esac",
									"",
									'workspace="$requested_root/$app_id"',
									"",
									'cd "$workspace"',
									"",
									'mkdir -p "$workspace/flatpak-repo"',
									"",
									"flatpak build-export \\",
									'  "$workspace/flatpak-repo" \\',
									'  "$workspace/flatpak-build" \\',
									'  "$app_version"'
							]
					)

			invokeWsl(
					[
							"bash",
							script,
							flatpakWslRoot,
							flatpakAppId,
							version.toString()
					],
					"repository-export"
			)
		}

		/*
         * --------------------------------------------------------
         * CREATE BUNDLE
         * --------------------------------------------------------
         */

		runStage(
				"Creating bundle"
		) {

			def script =
					createWslScript(
							"bundle",
							[
									"#!/usr/bin/env bash",
									"set -eu",
									"",
									'requested_root="$1"',
									'app_id="$2"',
									'app_version="$3"',
									"",
									'if [ -z "$requested_root" ]; then',
									'  requested_root="$HOME/abnw-flatpak-build"',
									"fi",
									"",
									'case "$requested_root" in',
									'  "~") requested_root="$HOME" ;;',
									'  "~/"*) requested_root="$HOME/${requested_root#~/}" ;;',
									'  /*) ;;',
									'  *) requested_root="$HOME/$requested_root" ;;',
									"esac",
									"",
									'workspace="$requested_root/$app_id"',
									"",
									'cd "$workspace"',
									"",
									'artifact="$workspace/ABNW Launcher-$app_version.flatpak"',
									"",
									'rm -f "$artifact"',
									"",
									"flatpak build-bundle \\",
									"  --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \\",
									'  "$workspace/flatpak-repo" \\',
									'  "$artifact" \\',
									'  "$app_id" \\',
									'  "$app_version"',
									"",
									'test -s "$artifact"'
							]
					)

			invokeWsl(
					[
							"bash",
							script,
							flatpakWslRoot,
							flatpakAppId,
							version.toString()
					],
					"bundle"
			)
		}

		/*
         * --------------------------------------------------------
         * COPY ARTIFACT BACK TO WINDOWS
         * --------------------------------------------------------
         */

		runStage(
				"Copying artifact to Windows"
		) {

			def script =
					createWslScript(
							"copy-artifact",
							[
									"#!/usr/bin/env bash",
									"set -eu",
									"",
									'requested_root="$1"',
									'app_id="$2"',
									'app_version="$3"',
									'windows_artifact="$4"',
									"",
									'if [ -z "$requested_root" ]; then',
									'  requested_root="$HOME/abnw-flatpak-build"',
									"fi",
									"",
									'case "$requested_root" in',
									'  "~") requested_root="$HOME" ;;',
									'  "~/"*) requested_root="$HOME/${requested_root#~/}" ;;',
									'  /*) ;;',
									'  *) requested_root="$HOME/$requested_root" ;;',
									"esac",
									"",
									'workspace="$requested_root/$app_id"',
									'artifact="$workspace/ABNW Launcher-$app_version.flatpak"',
									"",
									'test -s "$artifact"',
									"",
									'mkdir -p "$(dirname "$windows_artifact")"',
									'cp -f "$artifact" "$windows_artifact"'
							]
					)

			invokeWsl(
					[
							"bash",
							script,
							flatpakWslRoot,
							flatpakAppId,
							version.toString(),
							wslBundle
					],
					"copy-artifact"
			)
		}

		/*
         * --------------------------------------------------------
         * TIMINGS
         * --------------------------------------------------------
         */

		def totalElapsedNanos =
				System.nanoTime() -
						totalStartedAt

		println(
				"[ABNW Flatpak] Timing breakdown:"
		)

		timings.each {
			label,
			elapsedNanos ->

				println(
						String.format(
								Locale.ROOT,
								"  %-34s %s",
								"${label}:",
								formatDuration(
										elapsedNanos
								)
						)
				)
		}

		println(
				String.format(
						Locale.ROOT,
						"  %-34s %s",
						"Total:",
						formatDuration(
								totalElapsedNanos
						)
				)
		)

		if (
				!flatpakBundle
						.get()
						.asFile
						.isFile()
		) {
			throw new GradleException(
					"WSL completed without producing " +
							"${flatpakBundle.get().asFile}."
			)
		}
	}
}

/*
 * ============================================================
 * CLEAN FLATPAK BUILD
 * ============================================================
 */

tasks.register(
		"cleanFlatpakBuild"
) {

	group = "distribution"

	description =
			"Removes disposable Flatpak build and repository state " +
					"while preserving WSL Flatpak caches."

	doLast {
		if (
				isWindowsHost()
		) {
			project.delete(
					flatpakBundle
							.get()
							.asFile
			)

			def script =
					createWslScript(
							"clean-flatpak",
							[
									"#!/usr/bin/env bash",
									"set -eu",
									"",
									'requested_root="$1"',
									'app_id="$2"',
									"",
									'if [ -z "$requested_root" ]; then',
									'  requested_root="$HOME/abnw-flatpak-build"',
									"fi",
									"",
									'case "$requested_root" in',
									'  "~") requested_root="$HOME" ;;',
									'  "~/"*) requested_root="$HOME/${requested_root#~/}" ;;',
									'  /*) ;;',
									'  *) requested_root="$HOME/$requested_root" ;;',
									"esac",
									"",
									'case "$requested_root" in',
									'  /mnt/*)',
									'    echo "ERROR: Refusing to clean a Windows-mounted Flatpak workspace."',
									"    exit 2",
									"    ;;",
									"esac",
									"",
									'workspace="$requested_root/$app_id"',
									"",
									'rm -rf "$workspace/flatpak-build"',
									'rm -rf "$workspace/flatpak-repo"',
									'rm -f "$workspace"/ABNW\\ Launcher-*.flatpak',
									"",
									'echo "Removed disposable Flatpak build state from $workspace"',
									'echo "Preserved Flatpak SDK, runtime, and download caches."'
							]
					)

			invokeWsl(
					[
							"bash",
							script,
							flatpakWslRoot,
							flatpakAppId
					],
					"clean"
			)

		} else if (
				isLinuxHost()
		) {
			project.delete(
					flatpakBuildDirectory
							.get()
							.asFile,

					flatpakRepository
							.get()
							.asFile,

					flatpakBundle
							.get()
							.asFile
			)

			println(
					"[ABNW Flatpak] Removed disposable local build " +
							"and repository state; preserved Flatpak caches."
			)

		} else {
			throw new GradleException(
					"Flatpak cleanup requires Linux " +
							"or Windows with WSL."
			)
		}
	}
}

/*
 * ============================================================
 * FLATPAK STATUS
 * ============================================================
 */

tasks.register(
		"flatpakStatus"
) {

	group = "distribution"

	description =
			"Shows active Flatpak, WSL, OSTree, Gradle, and Java processes."

	doLast {
		def processPattern =
				"ps aux | grep -E " +
						"'flatpak|flatpak-builder|ostree|gradle|java' " +
						"| grep -v grep || true"

		if (
				isWindowsHost()
		) {
			invokeWsl(
					[
							"bash",
							"-lc",
							processPattern
					],
					"status"
			)

		} else if (
				isLinuxHost()
		) {
			def process =
					new ProcessBuilder(
							[
									"sh",
									"-lc",
									processPattern
							]
					)
							.redirectErrorStream(
									true
							)
							.start()

			println(
					process
							.inputStream
							.getText("UTF-8")
			)

			process.waitFor()

		} else {
			throw new GradleException(
					"Flatpak status requires Linux " +
							"or Windows with WSL."
			)
		}
	}
}

/*
 * ============================================================
 * BUILD TASK
 * ============================================================
 */

tasks.build {
	dependsOn(
			tasks.shadowJar,
			linuxZip
	)
}

/*
 * ============================================================
 * RUN
 * ============================================================
 */

tasks.named(
		"run",
		JavaExec
) {
	if (
			System
					.getProperty("os.name")
					.toLowerCase(Locale.ROOT)
					.contains("mac")
	) {
		jvmArgs(
				"-XstartOnFirstThread"
		)
	}
}