import java.nio.ByteBuffer
import java.nio.ByteOrder

plugins {
	id "application"
	id "com.gradleup.shadow"
}

def launcher = new Properties()
file("launcher.properties").withInputStream { launcher.load(it) }
def prop = { String key ->
	def value = launcher.getProperty(key)
	if (value == null) {
		throw new GradleException("launcher.properties is missing ${key}")
	}
	value.trim()
}

group = "org.teamzetaverse"
version = prop("launcher_version")

application {
	mainClass = "org.teamzetaverse.launcher.LauncherMain"
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(prop("java_version") as int))
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

repositories {
	mavenCentral()
}

def imguiVersion = prop("imgui_version")
def lwjglNatives = ["natives-windows", "natives-windows-arm64", "natives-linux", "natives-linux-arm64", "natives-macos", "natives-macos-arm64"]

dependencies {
	implementation "io.github.spair:imgui-java-binding:${imguiVersion}"
	implementation "io.github.spair:imgui-java-lwjgl3:${imguiVersion}"
	runtimeOnly "io.github.spair:imgui-java-natives-windows:${imguiVersion}"
	runtimeOnly "io.github.spair:imgui-java-natives-linux:${imguiVersion}"
	runtimeOnly "io.github.spair:imgui-java-natives-macos:${imguiVersion}"

	implementation platform("org.lwjgl:lwjgl-bom:${prop("lwjgl_version")}")
	["lwjgl", "lwjgl-glfw", "lwjgl-opengl", "lwjgl-stb", "lwjgl-tinyfd"].each { module ->
		implementation "org.lwjgl:${module}"
		lwjglNatives.each { natives -> runtimeOnly "org.lwjgl:${module}::${natives}" }
	}

	implementation "com.google.code.gson:gson:${prop("gson_version")}"
	implementation "org.teamzetaverse:cosmetics-api:1.0.0"
	implementation "com.davidehrmann.vcdiff:vcdiff-core:${prop("vcdiff_version")}"
	implementation "org.slf4j:slf4j-api:${prop("slf4j_version")}"
	implementation "org.slf4j:slf4j-nop:${prop("slf4j_version")}"
}

def buildInfo = [
		version    : version.toString(),
		repository : prop("releases_repository"),
		branch     : prop("releases_branch"),
		launcherRepository: prop("launcher_repository"),
		launcherBranch    : prop("launcher_branch"),
		msaClientId: prop("msa_client_id"),
		discordClientId   : prop("discord_client_id"),
		cosmeticsApiUrl   : launcher.getProperty("cosmetics_api_url", "").trim(),
		patreonPageUrl    : launcher.getProperty("patreon_page_url", "").trim(),
]

tasks.processResources {
	inputs.properties(buildInfo)
	filesMatching("abnw-launcher.properties") {
		expand(buildInfo)
	}
	from("feed") {
		into("feed")
	}
}

tasks.jar {
	enabled = false
}

tasks.shadowJar {
	archiveBaseName.set("abnw-launcher")
	archiveClassifier.set("")
	from(files("LICENSE", "THIRD-PARTY-NOTICES.md")) {
		into("META-INF/abnw-launcher")
	}
	manifest {
		attributes("Main-Class": application.mainClass.get(), "Implementation-Version": version.toString())
	}
}

def jpackageInput = layout.buildDirectory.dir("jpackage/input")
def jpackageOutput = layout.buildDirectory.dir("distributions")
def wixPathCache = layout.buildDirectory.file("jpackage/wixpath.txt")
def windowsIcon = layout.buildDirectory.file("jpackage/abnw-launcher.ico")
def windowsIconInputs = [16, 32, 48, 256].collect {
	file("src/main/resources/assets/icon_${it}.png")
}

def findJpackage = {
	if (!System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")) {
		throw new GradleException("The jpackage task creates a Windows application and must run on Windows.")
	}

	def javaHome = file(System.getProperty("java.home"))
	def jpackageExecutable = new File(javaHome, "bin/jpackage.exe")
	if (!jpackageExecutable.isFile()) {
		jpackageExecutable = new File(javaHome, "bin/jpackage")
	}
	if (!jpackageExecutable.isFile()) {
		throw new GradleException("Could not find jpackage under ${javaHome}. Run Gradle with a JDK, not a JRE.")
	}
	jpackageExecutable
}

def findWix = {
	def output = new ByteArrayOutputStream()
	def script = file("scripts/find-wix.py")
	def pythonCommands = [
		[System.getenv("PYTHON")].findAll { it },
		["python"],
		["py", "-3"]
	].findAll { !it.isEmpty() }
	def process = null
	def startFailure = null
	for (def command : pythonCommands) {
		try {
			process = new ProcessBuilder(command + [script.absolutePath, "--cache-file", wixPathCache.get().asFile.absolutePath])
				.redirectError(ProcessBuilder.Redirect.INHERIT)
				.start()
			break
		} catch (IOException failure) {
			startFailure = failure
		}
	}
	if (process == null) {
		throw new GradleException("Could not start Python to locate WiX. Install Python or set the PYTHON environment variable.", startFailure)
	}
	output << process.inputStream.getText("UTF-8")
	def exitCode = process.waitFor()
	def directory = output.toString("UTF-8").trim()
	if (exitCode != 0 || directory.isEmpty()) {
		throw new GradleException("Could not locate WiX. Install WiX 3+ or WiX 4/5, then run the jpackage task again.")
	}
	directory
}

def jpackageArguments = { String packageType, File inputDirectory, File outputDirectory ->
	[
		findJpackage().absolutePath,
		"--type", packageType,
		"--name", "ABNW Launcher",
		"--app-version", version.toString(),
		"--vendor", "Team Zetaverse",
		"--description", "The A Brand New World launcher.",
		"--java-options", "-Dfile.encoding=UTF-8",
		"--java-options", "-Dstdout.encoding=UTF-8",
		"--java-options", "-Dstderr.encoding=UTF-8",
		"--input", inputDirectory.absolutePath,
		"--main-jar", tasks.shadowJar.archiveFile.get().asFile.name,
		"--main-class", application.mainClass.get(),
		"--dest", outputDirectory.absolutePath
	]
}

def windowsIconTask = tasks.register("generateWindowsIcon") {
	group = "distribution"
	description = "Builds the multi-size Windows icon used by jpackage and its shortcuts."
	inputs.files(windowsIconInputs)
	outputs.file(windowsIcon)

	doLast {
		def images = windowsIconInputs.collect { source ->
			if (!source.isFile()) {
				throw new GradleException("Missing launcher icon: ${source}")
			}
			[size: Integer.parseInt(source.name.replaceAll("[^0-9]", "")), bytes: source.bytes]
		}
		def headerSize = 6 + (16 * images.size())
		def totalSize = headerSize + images.sum { it.bytes.length }
		def icon = ByteBuffer.allocate(totalSize).order(ByteOrder.LITTLE_ENDIAN)
		icon.putShort(0 as short)
		icon.putShort(1 as short)
		icon.putShort(images.size() as short)
		def offset = headerSize
		images.each { image ->
			def dimension = image.size == 256 ? 0 : image.size
			icon.put(dimension as byte)
			icon.put(dimension as byte)
			icon.put(0 as byte)
			icon.put(0 as byte)
			icon.putShort(1 as short)
			icon.putShort(32 as short)
			icon.putInt(image.bytes.length)
			icon.putInt(offset)
			offset += image.bytes.length
		}
		images.each { image -> icon.put(image.bytes) }
		windowsIcon.get().asFile.parentFile.mkdirs()
		windowsIcon.get().asFile.bytes = icon.array()
	}
}

def jpackageInputTask = tasks.register("prepareJpackageInput", Sync) {
	group = "distribution"
	description = "Stages the launcher JAR for jpackage."
	dependsOn(tasks.shadowJar)
	from(tasks.shadowJar)
	into(jpackageInput)
}

tasks.register("jpackage", Exec) {
	group = "distribution"
	description = "Builds the Windows ABNW Launcher installer as an .exe with a bundled Java runtime."
	dependsOn(jpackageInputTask, windowsIconTask)

	def outputFile = jpackageOutput.map { it.file("ABNW Launcher-${version}.exe") }
	inputs.file(tasks.named("shadowJar").flatMap { it.archiveFile })
	outputs.file(outputFile)

	doFirst {
		def inputDirectory = jpackageInput.get().asFile
		def destination = jpackageOutput.get().asFile
		def wixDirectory = findWix()
		destination.mkdirs()
		project.delete(outputFile.get().asFile)
		environment("Path", wixDirectory + File.pathSeparator + (System.getenv("Path") ?: System.getenv("PATH") ?: ""))
		commandLine(jpackageArguments("exe", inputDirectory, destination) + [
			"--icon", windowsIcon.get().asFile.absolutePath,
			"--win-menu",
			"--win-menu-group", "ABNW",
			"--win-shortcut",
			"--win-upgrade-uuid", "9d7f5c1b-9b3a-4bc2-8a21-7d2c8f9b1e44"
		])
	}
}

def linuxZip = tasks.register("linuxZip", Zip) {
	group = "distribution"
	description = "Packages the launcher jar with launch.sh and the Java install scripts for Linux."
	def folder = "abnw-launcher-${version}"
	archiveBaseName.set("abnw-launcher")
	archiveClassifier.set("linux")
	destinationDirectory.set(layout.buildDirectory.dir("distributions"))
	into(folder) {
		from(tasks.shadowJar)
		from(files("LICENSE", "THIRD-PARTY-NOTICES.md"))
		from("linux") {
			include("LINUX-GUIDE.md")
		}
	}
	into(folder) {
		from("linux") {
			include("**/*.sh")
		}
		filter(org.apache.tools.ant.filters.FixCrLfFilter, eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance("lf"))
		filePermissions {
			unix("rwxr-xr-x")
		}
	}
	dirPermissions {
		unix("rwxr-xr-x")
	}
}

def flatpakAppId = "org.teamzetaverse.ABNWLauncher"
def flatpakRoot = layout.buildDirectory.dir("flatpak")
def flatpakContext = flatpakRoot.map { it.dir("context") }
def flatpakBuildDirectory = flatpakRoot.map { it.dir("build") }
def flatpakRepository = flatpakRoot.map { it.dir("repo") }
def flatpakBundle = layout.buildDirectory.file("distributions/ABNW Launcher-${version}.flatpak")
def flatpakManifest = file("flatpak/${flatpakAppId}.yml")

def isLinuxHost = {
	System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("linux")
}

def isWindowsHost = {
	System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
}

def requireFlatpakCommand = { String command ->
	def path = System.getenv("PATH") ?: ""
	def executable = path.split(java.util.regex.Pattern.quote(File.pathSeparator))
		.collect { new File(it, command) }
		.find { it.isFile() && it.canExecute() }
	if (executable == null) {
		throw new GradleException("Could not find ${command}. Install flatpak-builder and Flatpak, then run :launcher:flatpak on Linux.")
	}
	executable
}

def flatpakContextTask = tasks.register("prepareFlatpakContext", Sync) {
	group = "distribution"
	description = "Stages the launcher JAR and ABNW icons for Flatpak."
	dependsOn(tasks.shadowJar)
	into(flatpakContext)
	from(tasks.shadowJar) {
		rename { "launcher.jar" }
	}
	from("flatpak") {
		include("launch-abnw-launcher.sh")
		include("${flatpakAppId}.desktop")
	}
	from("src/main/resources/assets/icon_16.png") {
		into("icons/16x16/apps")
		rename { "${flatpakAppId}.png" }
	}
	from("src/main/resources/assets/icon_32.png") {
		into("icons/32x32/apps")
		rename { "${flatpakAppId}.png" }
	}
	from("src/main/resources/assets/icon_48.png") {
		into("icons/48x48/apps")
		rename { "${flatpakAppId}.png" }
	}
	from("src/main/resources/assets/icon_256.png") {
		into("icons/256x256/apps")
		rename { "${flatpakAppId}.png" }
	}
}

tasks.register("flatpakBuild", Exec) {
	group = "distribution"
	description = "Builds the ABNW Launcher Flatpak repository. Requires Linux flatpak-builder."
	dependsOn(flatpakContextTask)
	inputs.file(flatpakManifest)
	inputs.dir(flatpakContext)
	outputs.dir(flatpakRepository)

	doFirst {
		if (!System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("linux")) {
			throw new GradleException("The Flatpak task must run on Linux with flatpak-builder installed.")
		}
		def builder = requireFlatpakCommand("flatpak-builder")
		flatpakBuildDirectory.get().asFile.mkdirs()
		flatpakRepository.get().asFile.mkdirs()
		commandLine(builder.absolutePath,
			"--force-clean",
			"--repo=${flatpakRepository.get().asFile.absolutePath}",
			flatpakBuildDirectory.get().asFile.absolutePath,
			flatpakManifest.absolutePath)
	}
}

def findWsl = {
	def systemRoot = System.getenv("SystemRoot") ?: "C:\\Windows"
	def candidates = [
		new File(systemRoot, "System32/wsl.exe"),
		new File(systemRoot, "Sysnative/wsl.exe")
	]
	def executable = candidates.find { it.isFile() }
	if (executable == null) {
		throw new GradleException("Could not find wsl.exe. Install and initialize an Ubuntu WSL distribution before building the Flatpak.")
	}
	executable
}

def windowsPathToWsl = { File directory ->
	def absolute = directory.absoluteFile.absolutePath
	if (!(absolute ==~ /[A-Za-z]:[\\\\].*/)) {
		throw new GradleException("The WSL Flatpak build needs a drive-letter workspace path, got ${absolute}.")
	}
	def drive = absolute.substring(0, 1).toLowerCase(Locale.ROOT)
	def rest = absolute.substring(2).replace('\\' as char, '/' as char)
	"/mnt/${drive}${rest.startsWith('/') ? rest : '/' + rest}"
}

def flatpakBundleTask = tasks.register("flatpakBundle", Exec) {
	group = "distribution"
	description = "Builds the ABNW Launcher Flatpak bundle. Requires Linux flatpak-builder and Flatpak."
	dependsOn("flatpakBuild")
	inputs.dir(flatpakRepository)
	outputs.file(flatpakBundle)

	doFirst {
		if (!System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("linux")) {
			throw new GradleException("The Flatpak task must run on Linux with flatpak-builder installed.")
		}
		def flatpak = requireFlatpakCommand("flatpak")
		flatpakBundle.get().asFile.parentFile.mkdirs()
		project.delete(flatpakBundle.get().asFile)
		commandLine(flatpak.absolutePath,
			"build-bundle",
			"--runtime-repo=https://flathub.org/repo/flathub.flatpakrepo",
			flatpakRepository.get().asFile.absolutePath,
			flatpakBundle.get().asFile.absolutePath,
			flatpakAppId,
			version.toString())
	}
}

def flatpakLinuxTask = tasks.register("flatpakLinux") {
	group = "distribution"
	description = "Builds the ABNW Launcher Flatpak inside a Linux environment."
	dependsOn(flatpakBundleTask)
}

tasks.register("flatpak") {
	group = "distribution"
	description = "Builds the ABNW Launcher Flatpak, using WSL automatically on Windows."
	if (isLinuxHost()) {
		dependsOn(flatpakLinuxTask)
	} else if (isWindowsHost()) {
		// Stage the JAR and icons on Windows, then let WSL run the Linux-only
		// Flatpak tools directly. Gradle itself does not need to be installed in WSL.
		dependsOn(flatpakContextTask)
	} else if (!isWindowsHost()) {
		doLast {
			throw new GradleException("The Flatpak task requires Linux or Windows with an initialized WSL distribution.")
		}
	}
	inputs.file(flatpakManifest)
	inputs.file(tasks.shadowJar.archiveFile)
	inputs.files(
		"flatpak/launch-abnw-launcher.sh",
		"flatpak/${flatpakAppId}.desktop",
		"src/main/resources/assets/icon_16.png",
		"src/main/resources/assets/icon_32.png",
		"src/main/resources/assets/icon_48.png",
		"src/main/resources/assets/icon_256.png"
	)
	outputs.file(flatpakBundle)

	doLast {
		if (!isWindowsHost()) {
			return
		}
		def wsl = findWsl()
		def wslDistribution = (System.getenv("ABNW_WSL_DISTRIBUTION") ?: "").trim()
		def invokeWsl = { List<?> toolArguments, String toolName ->
			List<String> wslCommand = new ArrayList<>()
			wslCommand.add(String.valueOf(wsl.absolutePath))
			if (!wslDistribution.isEmpty()) {
				wslCommand.add("--distribution")
				wslCommand.add(wslDistribution)
			}
			wslCommand.add("--cd")
			wslCommand.add(windowsPathToWsl(project.projectDir).toString())
			wslCommand.add("--")
			toolArguments.each { argument ->
				wslCommand.add(String.valueOf(argument))
			}
			String[] wslCommandArray = new String[wslCommand.size()]
			wslCommand.toArray(wslCommandArray)
			def wslProcess = new ProcessBuilder(wslCommandArray)
				.directory(project.projectDir)
				.redirectErrorStream(true)
				.start()
			def wslOutput = wslProcess.inputStream.getText("UTF-8")
			def wslExitCode = wslProcess.waitFor()
			def wslLog = new File(flatpakRoot.get().asFile, "wsl-${toolName}.log")
			wslLog.parentFile.mkdirs()
			wslLog.setText(wslOutput, "UTF-8")
			if (wslExitCode != 0) {
				if (wslExitCode == 127) {
					throw new GradleException("WSL could not find ${toolName}. Install ${toolName} in the selected WSL distribution.")
				}
				def outputLines = wslOutput.readLines()
				def tail = outputLines.takeRight(80).join(System.lineSeparator())
				throw new GradleException("The WSL ${toolName} command failed with exit code ${wslExitCode}. Full output: ${wslLog}\nLast output:\n${tail}")
			}
		}

		project.delete(flatpakBuildDirectory.get().asFile, flatpakRepository.get().asFile, flatpakBundle.get().asFile)
		def wslManifest = windowsPathToWsl(flatpakManifest).toString()
		def wslBuildDirectory = windowsPathToWsl(flatpakBuildDirectory.get().asFile).toString()
		def wslRepository = windowsPathToWsl(flatpakRepository.get().asFile).toString()
		def wslBundle = windowsPathToWsl(flatpakBundle.get().asFile).toString()
		// The SDK and runtime live inside the selected WSL distribution. Install the
		// exact refs required by the manifest before invoking flatpak-builder. The
		// install is idempotent, so subsequent builds finish immediately when the
		// refs are already present.
		invokeWsl([
			"flatpak",
			"remote-add",
			"--user",
			"--if-not-exists",
			"flathub",
			"https://flathub.org/repo/flathub.flatpakrepo"
		], "flatpak-remote")
		invokeWsl([
			"flatpak",
			"install",
			"--user",
			"--assumeyes",
			"--or-update",
			"flathub",
			"org.freedesktop.Platform//24.08",
			"org.freedesktop.Sdk//24.08",
			"org.freedesktop.Sdk.Extension.openjdk21//24.08"
		], "flatpak-install")
		invokeWsl([
			"flatpak-builder",
			"--force-clean",
			"--verbose",
			"--repo=${wslRepository}",
			wslBuildDirectory,
			wslManifest
		], "flatpak-builder")
		invokeWsl([
			"flatpak",
			"build-bundle",
			"--runtime-repo=https://flathub.org/repo/flathub.flatpakrepo",
			wslRepository,
			wslBundle,
			flatpakAppId,
			version.toString()
		], "flatpak")
		if (!flatpakBundle.get().asFile.isFile()) {
			throw new GradleException("WSL completed without producing ${flatpakBundle.get().asFile}.")
		}
	}
}

tasks.build {
	dependsOn tasks.shadowJar, linuxZip
}

tasks.named("run", JavaExec) {
	if (System.getProperty("os.name").toLowerCase().contains("mac")) {
		jvmArgs("-XstartOnFirstThread")
	}
}
