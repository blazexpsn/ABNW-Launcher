/*
 * ============================================================
 * WINDOWS INSTALLER
 * ============================================================
 */

tasks.register(
		"jpackage",
		Exec
) {

	group = "distribution"

	description =
			"Builds the Windows ABNW Launcher installer " +
					"as an .exe with a bundled Java runtime."

	dependsOn(
			jpackageInputTask,
			windowsIconTask
	)

	def outputFile =
			jpackageOutput.map {
				it.file(
						"ABNW Launcher-${version}.exe"
				)
			}

	inputs.file(
			tasks
					.named("shadowJar")
					.flatMap {
						it.archiveFile
					}
	)

	outputs.file(
			outputFile
	)

	doFirst {
		def inputDirectory =
				jpackageInput
						.get()
						.asFile

		def destination =
				jpackageOutput
						.get()
						.asFile

		def wixDirectory =
				findWix()

		destination.mkdirs()

		project.delete(
				outputFile
						.get()
						.asFile
		)

		environment(
				"Path",

				wixDirectory +
						File.pathSeparator +
						(
								System.getenv("Path")
										?:
										System.getenv("PATH")
												?:
												""
						)
		)

		commandLine(
				jpackageArguments(
						"exe",
						inputDirectory,
						destination
				) + [

						"--icon",
						windowsIcon
								.get()
								.asFile
								.absolutePath,

						"--win-menu",

						"--win-menu-group",
						"ABNW",

						"--win-shortcut",

						"--win-upgrade-uuid",
						"9d7f5c1b-9b3a-4bc2-8a21-7d2c8f9b1e44"
				]
		)
	}
}

