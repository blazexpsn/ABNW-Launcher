/*
 * ============================================================
 * NATIVE LINUX FLATPAK COMMAND LOOKUP
 * ============================================================
 */

def requireFlatpakCommand = {
	String command ->

		def path =
				System.getenv("PATH")
						?: ""

		def executable =
				path
						.split(
								java.util.regex.Pattern.quote(
										File.pathSeparator
								)
						)
						.collect {
							new File(
									it,
									command
							)
						}
						.find {
							it.isFile() &&
									it.canExecute()
						}

		if (executable == null) {
			throw new GradleException(
					"Could not find ${command}. " +
							"Install flatpak-builder and Flatpak, " +
							"then run :launcher:flatpak on Linux."
			)
		}

		executable
}

